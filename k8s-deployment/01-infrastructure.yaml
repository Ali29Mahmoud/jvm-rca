apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: eventuate-tram-examples-customers-and-orders
  labels:
    role: zookeeper
spec:
  ports:
  - port: 2181
    targetPort: 2181
  selector:
    role: zookeeper
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: eventuate-tram-examples-customers-and-orders
spec:
  selector:
    matchLabels:
      role: zookeeper
  replicas: 1
  template:
    metadata:
      labels:
        role: zookeeper
    spec:
      containers:
      - name: zookeeper
        image: eventuateio/eventuate-zookeeper:0.22.0.RELEASE
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 2181
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
        - name: KAFKA_HEAP_OPTS
          value: "-Xmx128m"
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: eventuate-tram-examples-customers-and-orders
  labels:
    role: kafka
spec:
  ports:
  - name: kafka
    port: 29092
    targetPort: 29092
  - name: external
    port: 9092
    targetPort: 9092
  selector:
    role: kafka
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: eventuate-tram-examples-customers-and-orders
spec:
  selector:
    matchLabels:
      role: kafka
  replicas: 1
  template:
    metadata:
      labels:
        role: kafka
    spec:
      containers:
      - name: kafka
        image: eventuateio/eventuate-kafka:0.20.0.RELEASE
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 29092
        - containerPort: 9092
        env:
        - name: KAFKA_LISTENERS
          value: LC://:29092,LX://:9092
        - name: KAFKA_ADVERTISED_LISTENERS
          value: LC://kafka:29092,LX://kafka:9092
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: LC:PLAINTEXT,LX:PLAINTEXT
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: LC
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: zookeeper:2181
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_HEAP_OPTS
          value: "-Xmx384m"
        resources:
          requests:
            cpu: 300m
            memory: 512Mi
          limits:
            cpu: 1500m
            memory: 1024Mi
---
