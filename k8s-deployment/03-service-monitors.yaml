apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cdc-service
  namespace: eventuate-tram-examples-customers-and-orders
  labels:
    release: monitoring
    svc: cdc-service
spec:
  selector:
    matchLabels:
      svc: cdc-service
  endpoints:
  - port: http
    path: /actuator/prometheus
    interval: 15s
    scrapeTimeout: 10s
---
