apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: default
spec:
  type: ExternalName
  externalName: loki.monitoring.svc.cluster.local
  ports:
  - port: 3100
    targetPort: 3100
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: eventuate-tram-examples-customers-and-orders
spec:
  type: ExternalName
  externalName: loki.monitoring.svc.cluster.local
  ports:
  - port: 3100
    targetPort: 3100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-logger
  namespace: default
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: busybox:1.36
        args:
        - /bin/sh
        - -c
        - |
          while true; do
            echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') INFO [order-service] Order created: orderId=1001 customerId=1 orderTotal=150.0 state=APPROVED";
            sleep 5;
          done
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
