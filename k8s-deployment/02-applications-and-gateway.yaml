apiVersion: v1
kind: Service
metadata:
  name: cdc-service
  namespace: eventuate-tram-examples-customers-and-orders
  labels:
    svc: cdc-service
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    svc: cdc-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdc-service
  namespace: eventuate-tram-examples-customers-and-orders
  labels:
    svc: cdc-service
spec:
  selector:
    matchLabels:
      svc: cdc-service
  replicas: 1
  template:
    metadata:
      labels:
        svc: cdc-service
    spec:
      initContainers:
      - name: otel-agent
        image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.20.1
        imagePullPolicy: IfNotPresent
        command: ["cp", "/javaagent.jar", "/otel/opentelemetry-javaagent.jar"]
        volumeMounts:
        - name: otel-agent
          mountPath: /otel
      containers:
      - name: cdc-service
        image: eventuateio/eventuate-cdc-service:0.20.0.RELEASE
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: otel-config
        env:
        - name: OTEL_SERVICE_NAME
          value: cdc-service
        - name: JAVA_TOOL_OPTIONS
          value: "-javaagent:/otel/opentelemetry-javaagent.jar"
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: sql-config
              key: connection_string
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: sql-config
              key: sql_user
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: sql-config
              key: sql_password
        - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
          valueFrom:
            configMapKeyRef:
              name: sql-config
              key: sql_driver
        - name: EVENTUATELOCAL_KAFKA_BOOTSTRAP_SERVERS
          value: kafka:29092
        - name: EVENTUATELOCAL_ZOOKEEPER_CONNECTION_STRING
          value: zookeeper:2181
        - name: EVENTUATELOCAL_CDC_READER_NAME
          value: PostgresWalReader
        - name: SPRING_PROFILES_ACTIVE
          value: PostgresWal
        - name: EVENTUATE_OUTBOX_ID
          value: "1"
        - name: JAVA_OPTS
          value: "-Xmx256m"
        resources:
          requests:
            cpu: 300m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
        volumeMounts:
        - name: otel-agent
          mountPath: /otel
      volumes:
      - name: otel-agent
        emptyDir: {}
---
