apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: eventuate-tram-examples-customers-and-orders
  labels:
    svc: postgres-exporter
    role: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      svc: postgres-exporter
  template:
    metadata:
      labels:
        svc: postgres-exporter
        role: postgres-exporter
    spec:
      containers:
      - name: postgres-exporter
        image: prometheuscommunity/postgres-exporter:v0.15.0
        imagePullPolicy: IfNotPresent
        env:
        - name: DATA_SOURCE_NAME
          value: "postgresql://eventuate:eventuate@postgres:5432/eventuate?sslmode=disable"
        ports:
        - containerPort: 9187
          name: metrics
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: eventuate-tram-examples-customers-and-orders
  labels:
    svc: postgres-exporter
    role: postgres-exporter
spec:
  ports:
  - name: metrics
    port: 9187
    targetPort: 9187
  selector:
    svc: postgres-exporter
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-exporter
  namespace: eventuate-tram-examples-customers-and-orders
  labels:
    release: monitoring
    svc: postgres-exporter
spec:
  selector:
    matchLabels:
      svc: postgres-exporter
  endpoints:
  - port: metrics
    path: /metrics
    interval: 15s
    scrapeTimeout: 10s
