apiVersion: v1
kind: Namespace
metadata:
  name: eventuate-tram-examples-customers-and-orders
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-config
  namespace: eventuate-tram-examples-customers-and-orders
data:
  connection_string: mongodb://mongodb:27017/customers_and_orders
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sql-config
  namespace: eventuate-tram-examples-customers-and-orders
data:
  connection_string: jdbc:postgresql://postgres:5432/eventuate
  sql_password: eventuate
  sql_user: eventuate
  sql_driver: org.postgresql.Driver
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-config
  namespace: eventuate-tram-examples-customers-and-orders
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=eventuate-tram-examples-customers-and-orders,deployment.environment=kind
