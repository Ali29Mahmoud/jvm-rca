apiVersion: v1
kind: Namespace
metadata:
  name: eventuate-tram-examples-customers-and-orders
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-config
  namespace: eventuate-tram-examples-customers-and-orders
data:
  connection_string: mongodb://mongodb:27017/customers_and_orders
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sql-config
  namespace: eventuate-tram-examples-customers-and-orders
data:
  connection_string: jdbc:postgresql://postgres:5432/eventuate
  sql_password: eventuate
  sql_user: eventuate
  sql_driver: org.postgresql.Driver
