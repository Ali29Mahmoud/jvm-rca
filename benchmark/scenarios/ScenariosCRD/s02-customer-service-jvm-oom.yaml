apiVersion: chaos-mesh.org/v1alpha1
kind: JVMChaos
metadata:
  name: customer-service-jvm-oom
  namespace: eventuate-tram-examples-customers-and-orders
spec:
  action: exception
  mode: one
  selector:
    namespaces:
      - eventuate-tram-examples-customers-and-orders
    labelSelectors:
      svc: customer-service
  class: "io.eventuate.examples.tram.ordersandcustomers.customers.domain.CustomerService"
  method: "createCustomer"
  exception: "java.lang.OutOfMemoryError"
  duration: "5m"
